<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f7f4ef; }
    model-viewer {
      width: 100%;
      height: 100vh;
      background-color: #f7f4ef;
    }
    .label {
      position: fixed;
      bottom: 16px;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #666;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <model-viewer
    src="https://raw.githubusercontent.com/unicornineverystall/unicorn-assets/61b6c2d8a3430edef0a27cdaa2b4948e3d558d84/Meshy_AI_Unicorn_Stainless_Cab_0527151958_texture.glb"
    ios-src="https://raw.githubusercontent.com/unicornineverystall/unicorn-assets/61b6c2d8a3430edef0a27cdaa2b4948e3d558d84/Meshy_AI_Unicorn_Stainless_Cab_0527152002_texture.usdz"
    alt="UNICORN in-stall period care dispenser"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    auto-rotate-delay="1000"
    shadow-intensity="1">
  </model-viewer>
  <p class="label">Rotate to explore · Tap the AR button to view in your space</p>
</body>
</html>
