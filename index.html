<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background: #f7f4ef; font-family: sans-serif; }
    model-viewer { width: 100%; height: 100vh; background-color: #f7f4ef; }
    #ar-button {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #2f3957;
      color: white;
      padding: 16px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      display: none;
      white-space: nowrap;
      z-index: 999;
    }
    #ar-button img { display: none; }
    #safari-notice {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #2f3957;
      color: white;
      padding: 20px 24px;
      text-align: center;
      font-size: 15px;
    }
    #safari-notice strong { display: block; font-size: 17px; margin-bottom: 6px; }
    #safari-notice code {
      display: block;
      margin-top: 10px;
      background: rgba(255,255,255,0.15);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      word-break: break-all;
    }
    #hint { position: fixed; bottom: 16px; width: 100%; text-align: center; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <model-viewer
    src="https://raw.githubusercontent.com/unicornineverystall/unicorn-assets/main/Meshy_AI_Unicorn_Stainless_Cab_0527183101_texture.glb"
    ios-src="https://raw.githubusercontent.com/unicornineverystall/unicorn-assets/main/Meshy_AI_Unicorn_Stainless_Cab_0527183604_texture.usdz"
    alt="UNICORN in-stall period care dispenser"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    auto-rotate-delay="1000"
    shadow-intensity="1">

    <a id="ar-button" slot="ar-button" rel="ar"
      href="https://raw.githubusercontent.com/unicornineverystall/unicorn-assets/main/Meshy_AI_Unicorn_Stainless_Cab_0527183604_texture.usdz">
      <img src="">
      See it in your stall
    </a>

  </model-viewer>

  <div id="safari-notice">
    <strong>AR requires Safari on iPhone</strong>
    Open this page in Safari to see the dispenser in your space.
    <code>unicornineverystall.github.io/unicorn-assets</code>
  </div>

  <p id="hint">Rotate to explore · Tap the button to view in your space</p>

  <script>
    const btn = document.getElementById('ar-button');
    const notice = document.getElementById('safari-notice');
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isAndroid = /Android/.test(navigator.userAgent);
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

    if (isAndroid) {
      btn.style.display = 'inline-block';
    } else if (isIOS && isSafari) {
      btn.style.display = 'inline-block';
    } else if (isIOS && !isSafari) {
      notice.style.display = 'block';
    }
  </script>
</body>
</html>
